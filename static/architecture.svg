<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
<title id="title">LOOMCARE V1 pendant — product block diagram (EVT target)</title><desc id="desc">nRF54L15 module with nPM1300 power management, certified Li-ion cell charged through cradle contacts, BMI270 motion sensor with wake interrupt, optional water-resistant ILPS28QSW barometer, DRV2605L haptic driver with LRA, PAM8904 piezo driver, one sealed button, RGB status LED and optional pilot data flash.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#237b6a"/></marker><marker id="p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#bf655b"/></marker><style>text{font-family:Arial,sans-serif;fill:#233d36;font-size:13px}.title{font-size:26px;font-weight:bold}.h{font-size:16px;font-weight:bold}.s{font-size:11px;fill:#607268}.m{font-family:monospace;font-size:12px}.box{fill:#f6f8f1;stroke:#b9cab5;stroke-width:1.5}.core{fill:#e5eedb;stroke:#4f7a63;stroke-width:2}.pwr{fill:#fbf0ec;stroke:#d7a99f;stroke-width:1.5}.opt{fill:#fff;stroke:#b9cab5;stroke-width:1.5;stroke-dasharray:6 4}.sig{fill:none;stroke:#237b6a;stroke-width:2}.pl{fill:none;stroke:#bf655b;stroke-width:2}.note{fill:#fff4df;stroke:#dcc89e}</style></defs>
<rect width="1200" height="860" fill="#fff"/>
<text x="36" y="44" class="title">LOOMCARE V1 pendant · product architecture</text>
<text x="36" y="68" class="s">EVT TARGET • block diagram, not a schematic • red = power, green = signals, dashed = optional • pin map is fixed in the EVT schematic</text>

<rect x="36" y="96" width="230" height="92" rx="10" class="pwr"/><text x="52" y="122" class="h">Charging cradle</text><text x="52" y="144" class="s">Spring pogo pins • magnetic alignment</text><text x="52" y="162" class="s">Powered by a BIS-certified USB adapter</text><text x="52" y="178" class="s">No USB port on the pendant</text>
<rect x="36" y="214" width="230" height="92" rx="10" class="pwr"/><text x="52" y="240" class="h">Recessed contacts</text><text x="52" y="262" class="s">Gold-plated flat pads on pendant</text><text x="52" y="280" class="s">ESD/TVS, reverse-polarity protection</text><text x="52" y="296" class="s">Sealed through-housing, no open port</text>
<path d="M151 188V214" class="pl" marker-end="url(#p)"/>
<rect x="36" y="336" width="230" height="124" rx="10" class="pwr"/><text x="52" y="362" class="h">Certified 1S Li-ion</text><text x="52" y="384">145–300 mAh (size target)</text><text x="52" y="404" class="s">Protection circuit (PCM) + 10k NTC</text><text x="52" y="422" class="s">BIS-registered cell (IS 16046)</text><text x="52" y="440" class="s">Charge rate per cell datasheet</text>

<rect x="306" y="96" width="262" height="364" rx="12" class="core"/><text x="324" y="126" class="h">Nordic nPM1300 PMIC</text>
<text x="324" y="152" class="m">VBUS ← contacts</text><text x="324" y="174" class="m">VBAT/NTC ↔ cell</text><text x="324" y="200">32–800 mA linear charger</text><text x="324" y="222">BUCK1 → 1.8 V system rail</text><text x="324" y="244">VSYS → haptic + sounder drivers</text><text x="324" y="266">Fuel gauge (V, I, T + model)</text><text x="324" y="288">Ship mode 370 nA</text><text x="324" y="310">Watchdog + failed-boot recovery</text><text x="324" y="332">Hard reset (long hold)</text><text x="324" y="354">Power-loss warning</text><text x="324" y="376">TWI control + interrupt</text><text x="324" y="398" class="m">SHPHLD ← button</text><text x="324" y="424" class="s">Configure hard-reset hold far longer</text><text x="324" y="440" class="s">than the 2-second SOS hold</text>
<path d="M266 260H306" class="pl" marker-end="url(#p)"/><path d="M266 398H306" class="pl"/><path d="M306 398H266" class="pl" marker-end="url(#p)"/>

<rect x="610" y="96" width="262" height="364" rx="12" class="core"/><text x="628" y="126" class="h">nRF54L15 module</text><text x="628" y="146" class="s">e.g. Raytac AN54LV-15 • chip antenna</text><text x="628" y="162" class="s">6.4 × 8.4 × 1.5 mm • pre-certified incl. WPC</text>
<text x="628" y="190">128 MHz Cortex-M33</text><text x="628" y="212">1.5 MB NVM / 256 KB RAM</text><text x="628" y="234">Bluetooth 6.0 LE, 1M + Coded PHY</text><text x="628" y="256">3.0 µA idle with RTC (datasheet)</text><text x="628" y="278">TX 5.0 mA @ 0 dBm, up to +8 dBm</text><text x="628" y="306" class="m">+ 32.768 kHz crystal</text><text x="628" y="330" class="m">TWI  ─ PMIC, baro, haptic</text><text x="628" y="352" class="m">SPI  ─ IMU, flash</text><text x="628" y="374" class="m">GPIO ─ INT1/INT2, button</text><text x="628" y="396" class="m">PWM  ─ piezo DIN, RGB LED</text><text x="628" y="424" class="s">Antenna keep-out and in-enclosure</text><text x="628" y="440" class="s">tuning required (body detuning)</text>
<path d="M568 200H610" class="pl" marker-end="url(#p)"/><text x="572" y="192" class="s">1.8 V</text>
<path d="M610 370H568" class="sig" marker-end="url(#a)"/><text x="574" y="362" class="s">TWI/INT</text>

<rect x="918" y="92" width="248" height="82" rx="10" class="box"/><text x="934" y="116" class="h">Bosch BMI270 IMU</text><text x="934" y="136" class="s">±16 g • 50 Hz accel, low-power mode</text><text x="934" y="152" class="s">Gyro only in ~6 s bursts after impacts</text><text x="934" y="166" class="s">INT1 any-motion wake (next power step)</text>
<rect x="918" y="186" width="248" height="74" rx="10" class="opt"/><text x="934" y="210" class="h">ST ILPS28QSW barometer</text><text x="934" y="230" class="s">Gel-filled, water-resistant, O-ring seal</text><text x="934" y="246" class="s">1.7 µA • height-drop confirmation</text>
<rect x="918" y="272" width="248" height="74" rx="10" class="box"/><text x="934" y="296" class="h">TI DRV2605L → coin LRA</text><text x="934" y="316" class="s">2–5.2 V from VSYS • auto-resonance</text><text x="934" y="332" class="s">1.8 V-compatible I²C • strong, consistent buzz</text>
<rect x="918" y="358" width="248" height="74" rx="10" class="box"/><text x="934" y="382" class="h">Diodes PAM8904 → piezo</text><text x="934" y="402" class="s">Charge pump: 18 Vpp from 3 V supply</text><text x="934" y="418" class="s">Acoustic port + waterproof membrane</text>
<rect x="918" y="444" width="248" height="74" rx="10" class="opt"/><text x="934" y="468" class="h">SPI NOR flash (pilot)</text><text x="934" y="488" class="s">e.g. MX25R6435F 64 Mbit, ultra-low power</text><text x="934" y="504" class="s">Raw motion logging for validation</text>
<path d="M872 134H918M872 222H918M872 308H918M872 394H918M872 450H895V480H918" class="sig" marker-end="url(#a)"/>

<rect x="610" y="490" width="126" height="92" rx="10" class="box"/><text x="624" y="514" class="h">Sealed button</text><text x="624" y="534" class="s">IP67 tactile switch</text><text x="624" y="550" class="s">under large TPE cap</text><text x="624" y="566" class="s">tap / 2 s hold = SOS</text>
<rect x="746" y="490" width="126" height="92" rx="10" class="box"/><text x="760" y="514" class="h">RGB LED</text><text x="760" y="534" class="s">Light pipe</text><text x="760" y="550" class="s">Short PWM pulses</text><text x="760" y="566" class="s">≤ 1–2 µA average</text>
<path d="M672 460V490M808 460V490" class="sig"/>
<path d="M437 460V540H610" class="sig"/><text x="450" y="532" class="s">SHPHLD (ship-mode wake)</text>

<path d="M437 540V600H1184V309H1166M1184 395H1166" class="pl"/><text x="450" y="594" class="s">VSYS → DRV2605L, PAM8904 (drivers disabled between alerts)</text>

<rect x="36" y="628" width="1130" height="128" rx="10" class="note"/><text x="54" y="654" class="h">Mechanical &amp; wear targets (lock only after EVT measurements)</text>
<text x="54" y="678">Enclosure: PC or PC/ABS, ultrasonic-welded, TPE overmould • IP67 minimum, IP68 target • every penetration (button, contacts, acoustic port, baro) sealed and ingress-tested</text>
<text x="54" y="700">Target ~32–38 × 28–34 × 9–11 mm, ~15–22 g • 4–5 mm prismatic cell + PCB + walls: smaller cells fit the thickness target more easily</text>
<text x="54" y="722">Wear: short breakaway lanyard (release force tested) • optional clip only after separate detection validation for that position</text>
<text x="54" y="744" class="s">Deliberately excluded from V1: GPS/GNSS, SIM/cellular, microphone, speaker, display, heart-rate and SpO₂ sensors.</text>
<text x="36" y="790" class="s">Programming: SWD test pads (pogo/Tag-Connect style) + production test points • Firmware: nRF Connect SDK (Zephyr) • Protocol/event model shared with the existing backend and apps</text>
<text x="36" y="810" class="s">Datasheet figures are typical values at 3 V and are not guaranteed; confirm every current with a power profiler on the real board.</text>
</svg>
