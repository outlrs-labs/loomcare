<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1320" viewBox="0 0 1200 1320" role="img" aria-labelledby="title desc">
<title id="title">LOOMCARE V1 ESP32 bench circuit</title><desc id="desc">Pin-level prototype wiring, protected output drivers and optional load-sharing battery power. Identical net labels are electrically connected. All grounds are common. GPIOs use 3.3 volt logic.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#233d36;font-size:13px}.title{font-size:27px;font-weight:bold}.h{font-size:17px;font-weight:bold}.small{font-size:11px;fill:#607268}.pin{font-family:monospace;font-size:13px}.wire{fill:none;stroke:#237b6a;stroke-width:2}.power{fill:none;stroke:#bf655b;stroke-width:2}.ground{fill:none;stroke:#687b80;stroke-width:2}.box{fill:#f6f8f1;stroke:#b9cab5;stroke-width:1.5}.chip{fill:#e8f0df;stroke:#537c67;stroke-width:2}.note{fill:#fff4df;stroke:#dcc89e}.dot{fill:#237b6a}</style></defs>
<rect width="1200" height="1320" fill="#fff"/>
<text x="35" y="43" class="title">LOOMCARE / V1 pendant circuit</text><text x="35" y="68" class="small">BENCH PROTOTYPE • Classic ESP32-WROOM-32 • Firmware GPIO names match this drawing • Revision 1</text>
<rect x="35" y="89" width="1130" height="55" rx="8" class="note"/><text x="52" y="112">All GND labels connect together. Identical net labels connect electrically. Power sensors and I²C pullups from 3V3 only.</text><text x="52" y="132">Start with USB only. Verify your board pinout and every voltage before connecting a battery. Not a production PCB or certified wearable.</text>
<rect x="45" y="175" width="245" height="400" rx="12" class="chip"/><text x="65" y="207" class="h">ESP32-WROOM-32</text><text x="65" y="230" class="small">DevKit • not ESP8266 / ESP32-S3</text>
<text x="65" y="265" class="pin">GPIO21   SDA</text><text x="65" y="298" class="pin">GPIO22   SCL</text><text x="65" y="331" class="pin">GPIO27   BUTTON</text><text x="65" y="364" class="pin">GPIO25   MOTOR_GATE</text><text x="65" y="397" class="pin">GPIO26   BUZZ_GATE</text><text x="65" y="430" class="pin">GPIO2    STATUS_LED</text><text x="65" y="463" class="pin">GPIO34   BAT_ADC (input)</text><text x="65" y="496" class="pin">GPIO35   USB_ADC (input)</text><text x="65" y="535" class="pin">3V3     GND     5V/VIN</text><text x="65" y="557" class="small">5V/VIN feeds board regulator only</text>
<path d="M260 260H322V197H750 M260 293H337V222H765" class="wire"/><text x="340" y="189" class="small">SDA bus</text><text x="340" y="216" class="small">SCL bus</text>
<rect x="370" y="248" width="205" height="205" rx="9" class="box"/><text x="386" y="276" class="h">MPU6050 / GY-521</text><text x="386" y="300" class="pin">SDA ← GPIO21</text><text x="386" y="325" class="pin">SCL ← GPIO22</text><text x="386" y="351" class="pin">VCC ← 3V3</text><text x="386" y="376" class="pin">GND ← GND</text><text x="386" y="400" class="pin">AD0 ← 3V3</text><text x="386" y="427" class="small">I²C address 0x69 • INT unused</text><path d="M405 197V248M430 222V248" class="wire"/>
<rect x="610" y="248" width="205" height="205" rx="9" class="box"/><text x="626" y="276" class="h">DS3231 mini RTC</text><text x="626" y="300" class="pin">SDA ← GPIO21</text><text x="626" y="325" class="pin">SCL ← GPIO22</text><text x="626" y="351" class="pin">VCC ← 3V3</text><text x="626" y="376" class="pin">GND ← GND</text><text x="626" y="400" class="pin">VBAT ← module cell</text><text x="626" y="427" class="small">I²C address 0x68 • UTC time</text><path d="M650 197V248M675 222V248" class="wire"/>
<rect x="845" y="175" width="310" height="280" rx="10" class="box"/><text x="863" y="206" class="h">Button &amp; status LED</text>
<text x="863" y="239" class="pin">GPIO27</text><path d="M935 234H980M980 234L1016 218M1020 234H1100V251" class="wire"/><circle cx="980" cy="234" r="3" class="dot"/><circle cx="1020" cy="234" r="3" class="dot"/><text x="1083" y="270" class="small">GND</text><text x="863" y="287" class="small">Normally-open switch • internal pullup</text><text x="863" y="317" class="pin">GPIO2 → 330 Ω → LED → GND</text><text x="863" y="341" class="small">LED anode toward resistor; cathode to GND</text><text x="863" y="379">Short press: cancel / acknowledge</text><text x="863" y="404">Hold 2 seconds: SOS</text><text x="863" y="429" class="small">No external voltage on the button</text>
<rect x="370" y="477" width="785" height="98" rx="8" class="note"/><text x="386" y="503" class="h">I²C bus and power details</text><text x="386" y="526">Fit 4.7 kΩ SDA→3V3 and SCL→3V3 pullups only if absent; avoid excessive parallel pullups.</text><text x="386" y="547">The RTC and IMU share 0x68 by default: the IMU AD0→3V3 connection is mandatory.</text><text x="386" y="566" class="small">RTC module must not charge a non-rechargeable coin cell. Select a documented non-charging module and matching battery.</text>
<text x="45" y="617" class="h">Two protected low-side output drivers</text><text x="45" y="639" class="small">Build this circuit twice: GPIO25 + vibration motor, and GPIO26 + 3.3 V active buzzer. Never power a load from a GPIO.</text>
<rect x="45" y="658" width="1110" height="243" rx="10" class="box"/>
<text x="65" y="735" class="pin">GPIO25 / GPIO26</text><path d="M206 730H230" class="wire"/><rect x="230" y="719" width="59" height="22" fill="white" stroke="#237b6a"/><text x="240" y="735" class="small">100 Ω</text><path d="M289 730H405" class="wire"/><circle cx="323" cy="730" r="4" class="dot"/><path d="M323 730V756" class="wire"/><rect x="311" y="756" width="24" height="44" fill="white" stroke="#237b6a"/><text x="250" y="783" class="small">100 kΩ</text><path d="M323 800V836H460" class="ground"/><text x="320" y="861" class="small">GND</text>
<rect x="405" y="702" width="127" height="94" rx="8" class="chip"/><text x="414" y="735" class="pin">G</text><text x="450" y="725" class="pin">D</text><text x="450" y="782" class="pin">S</text><text x="431" y="756" class="small">AO3400A</text><path d="M460 796V836M460 702V687H660V781" class="wire"/><text x="542" y="712" class="small">Drain / LOAD−</text>
<rect x="610" y="727" width="135" height="51" rx="6" fill="white" stroke="#237b6a"/><text x="625" y="748">Motor / buzzer</text><text x="625" y="767" class="small">3.3 V rated load</text><path d="M690 727V684H933M745 764H800V781H660" class="wire"/><text x="700" y="680" class="small">3V3 / LOAD+</text>
<rect x="849" y="723" width="168" height="57" rx="5" fill="white" stroke="#bf655b"/><text x="861" y="741" class="small">1N5819 flyback diode</text><text x="861" y="756" class="small">Cathode (stripe) → 3V3</text><text x="861" y="771" class="small">Anode → drain / LOAD−</text><path d="M933 684V723M933 780V816H660V781" class="power"/>
<text x="568" y="857" class="small">Add 100 µF + 100 nF across 3V3/GND near the motor. Check the regulator can supply motor startup current.</text><text x="568" y="878" class="small">Verify MOSFET pinout from its datasheet; drawing labels are electrical pins, not physical package order.</text>
<text x="45" y="940" class="h">Optional rechargeable power &amp; sensing · esp32battery firmware only</text>
<rect x="45" y="962" width="258" height="171" rx="10" class="box"/><text x="60" y="989" class="h">Protected 1S LiPo</text><text x="60" y="1014">3.7 V nominal / 4.2 V full</text><text x="60" y="1038">~2000 mAh; ≥1 A charge rating</text><text x="60" y="1064" class="pin">B+ → charger BAT / JST+</text><text x="60" y="1088" class="pin">B− → charger GND / JST−</text><text x="60" y="1113" class="small">Verify polarity before insertion.</text>
<rect x="333" y="962" width="300" height="171" rx="10" class="box"/><text x="349" y="989" class="h">PowerBoost 1000C</text><text x="349" y="1013">Load-sharing charger, 1 A max charge</text><text x="349" y="1038" class="pin">MicroUSB ← regulated 5 V / 2 A</text><text x="349" y="1062" class="pin">5V output → ESP32 5V/VIN</text><text x="349" y="1086" class="pin">GND → common GND</text><text x="349" y="1110" class="pin">EN → switch → GND (OFF)</text>
<rect x="663" y="962" width="492" height="171" rx="10" class="box"/><text x="678" y="989" class="h">Two independent voltage dividers</text><text x="678" y="1016" class="pin">BAT → 100 kΩ → BAT_ADC/GPIO34 → 100 kΩ → GND</text><text x="678" y="1045" class="pin">USB → 100 kΩ → USB_ADC/GPIO35 → 100 kΩ → GND</text><text x="678" y="1070" class="small">USB means charger input pin, NOT boosted output. Put 100 nF from</text><text x="678" y="1089" class="small">each ADC midpoint to GND. Max ADC voltage: 2.1 V battery / 2.625 V USB.</text><text x="678" y="1110" class="small">Battery % is approximate. USB presence does not prove charging current.</text>
<rect x="45" y="1157" width="1110" height="119" rx="9" class="note"/><text x="62" y="1183" class="h">Power and assembly gates</text><text x="62" y="1206">Disconnect the booster output before plugging computer USB into the ESP32; do not backfeed two supplies.</text><text x="62" y="1227">Never substitute a bare TP4056 for load sharing. Use a protected cell and a documented charger/cell combination.</text><text x="62" y="1248">No loose lithium cells, exposed conductors, or unsupported charging in a wearable. Test heat/current first; charge off-body.</text><text x="62" y="1268" class="small">Default esp32dev build uses USB power and reports unknown battery/charge status. Enclosure, water resistance, and battery life remain unvalidated.</text>
<text x="45" y="1301" class="small">Software pin mapping: hardware_code/pendant/src/main.cpp • Circuit is for supervised engineering tests; seek hardware review before a wearer pilot.</text>
</svg>
